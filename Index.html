<!DOCTYPE html>
<html>
<head>
    <title>JEE Countdown</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0d1117;
            color: white;
            margin: 0;
        }

        #countdown {
            font-size: 4rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="countdown"></div>

<script>
const targetDate = new Date("2026-09-16");

function updateCountdown() {
    const now = new Date();
    const diff = targetDate - now;

    const days = Math.ceil(diff / (1000 * 60 * 60 * 24));

    document.getElementById("countdown").textContent =
        days + " Days Left";
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
